<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Voice Call</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #e0e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #141b2b;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c8cff, #3ddc84);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .user-badge {
            background: #1a2744;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online { background: #3ddc84; }
        .dot.offline { background: #666; }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 240px;
            gap: 16px;
        }
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
        }
        
        .call-panel {
            background: #0f1625;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }
        .call-icon { font-size: 56px; margin-bottom: 12px; display: block; }
        .call-status { font-size: 18px; color: #8899bb; }
        .call-status.active { color: #3ddc84; }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a2744;
            color: #b0c4e8;
        }
        .btn:hover { transform: scale(1.03); filter: brightness(1.15); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .btn-primary { background: #2b6c9e; color: white; }
        .btn-danger { background: #8a2a2a; color: #ff8888; }
        .btn-mute { background: #2a3a5a; }
        .btn-mute.muted { background: #f5a623; color: #000; }
        
        .members-panel {
            background: #0f1625;
            border-radius: 16px;
            padding: 16px;
        }
        .members-panel h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #667799;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        .member-list {
            max-height: 250px;
            overflow-y: auto;
        }
        .member {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            margin-bottom: 4px;
            border-radius: 6px;
            background: rgba(255,255,255,0.02);
            font-size: 14px;
        }
        .member .name {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .member .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a4a7a, #4a2a7a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }
        .member .status {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 10px;
            background: #1a2744;
        }
        .member .status.in-call { background: #3ddc84; color: #000; }
        
        .login-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-box {
            background: #141b2b;
            padding: 40px;
            border-radius: 24px;
            max-width: 360px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .login-box h2 { margin-bottom: 8px; }
        .login-box p { color: #8899bb; margin-bottom: 20px; font-size: 14px; }
        .login-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #0a0e1a;
            color: #e0e8f0;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .login-input:focus { outline: none; border-color: #6c8cff; }
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6c8cff, #3ddc84);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-btn:hover { transform: scale(1.02); }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2744;
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 999;
            font-size: 14px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        
        .debug {
            font-size: 11px;
            color: #445566;
            margin-top: 12px;
            padding: 8px;
            background: #0a0e1a;
            border-radius: 8px;
            text-align: left;
            font-family: monospace;
            max-height: 60px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h2>🎙️ Group Call</h2>
        <p>Enter your name to join the room</p>
        <input type="text" id="loginName" class="login-input" placeholder="Your name..." maxlength="20" autofocus>
        <button class="login-btn" onclick="login()">Join Room</button>
        <div style="margin-top:12px;font-size:12px;color:#667799;text-align:center;">
            Everyone in the room can hear each other
        </div>
    </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">
    <div class="container">
        <div class="header">
            <div class="logo">🎙️ GroupCall</div>
            <div class="user-badge">
                <span class="dot online"></span>
                <span id="currentUserName">You</span>
                <button onclick="logout()" style="background:none;border:none;color:#667799;cursor:pointer;margin-left:8px;">✕</button>
            </div>
        </div>
        
        <div class="grid">
            <div class="call-panel">
                <span class="call-icon" id="callIcon">📞</span>
                <div class="call-status" id="callStatus">Ready</div>
                
                <div class="controls">
                    <button class="btn btn-primary" id="callBtn" onclick="toggleCall()">📞 Start Call</button>
                    <button class="btn btn-mute" id="muteBtn" onclick="toggleMute()" disabled>🔊 Mute</button>
                    <button class="btn btn-danger" id="leaveBtn" onclick="leaveCall()" disabled>Leave</button>
                </div>
                
                <div style="margin-top:12px;font-size:13px;color:#667799;">
                    👥 <span id="participantCount">0</span> in call
                </div>
                
                <div class="debug" id="debugLog">⚡ Ready</div>
            </div>
            
            <div class="members-panel">
                <h3>
                    👥 Members
                    <span id="memberCount">0</span>
                </h3>
                <div class="member-list" id="memberList">
                    <div style="text-align:center;color:#667799;padding:20px;font-size:13px;">
                        No members yet
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 🎯 SIMPLE GROUP CALL WITH WEBSOCKET-LIKE BEHAVIOR
// Using BroadcastChannel + localStorage for signaling
// ============================================================

// ----- STATE -----
const state = {
    user: null,
    inCall: false,
    muted: false,
    localStream: null,
    peers: new Map(), // userId -> { pc, stream, name }
    members: [], // { id, name, inCall }
    channel: null,
    debug: (msg) => {
        const el = document.getElementById('debugLog');
        if (el) el.textContent = msg;
        console.log('🔵', msg);
    }
};

// ----- LOGIN -----
function login() {
    const nameInput = document.getElementById('loginName');
    const name = nameInput.value.trim() || 'User_' + Math.floor(Math.random() * 1000);
    
    state.user = {
        id: 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        name: name
    };
    
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('currentUserName').textContent = name;
    
    state.debug('👋 Welcome ' + name);
    
    initSignaling();
    sendPresence();
    
    // Auto-join call after short delay
    setTimeout(() => {
        if (!state.inCall) {
            startCall();
        }
    }, 1000);
}

function logout() {
    leaveCall();
    state.user = null;
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    if (state.channel) {
        state.channel.close();
        state.channel = null;
    }
}

// ----- SIGNALING (BroadcastChannel + localStorage) -----
function initSignaling() {
    try {
        state.channel = new BroadcastChannel('group-call');
        state.channel.onmessage = (e) => handleSignal(e.data);
        state.debug('📡 Signaling via BroadcastChannel');
    } catch(e) {
        state.debug('⚠️ Using localStorage fallback');
        // localStorage polling fallback
        let lastTime = 0;
        setInterval(() => {
            const data = localStorage.getItem('group-call-signal');
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    if (parsed.time > lastTime) {
                        lastTime = parsed.time;
                        handleSignal(parsed.data);
                    }
                } catch(e) {}
            }
        }, 300);
        window._sendSignal = (data) => {
            localStorage.setItem('group-call-signal', JSON.stringify({
                time: Date.now(),
                data: data
            }));
        };
    }
}

function sendSignal(data) {
    if (state.channel) {
        state.channel.postMessage(data);
    } else if (window._sendSignal) {
        window._sendSignal(data);
    }
}

// ----- PRESENCE -----
function sendPresence() {
    if (!state.user) return;
    sendSignal({
        type: 'presence',
        userId: state.user.id,
        name: state.user.name,
        inCall: state.inCall
    });
}

// ----- HANDLE SIGNALS -----
function handleSignal(data) {
    if (!state.user) return;
    if (data.userId === state.user.id) return;
    
    state.debug('📨 ' + data.type + ' from ' + (data.name || data.userId));
    
    switch(data.type) {
        case 'presence':
            handlePresence(data);
            break;
        case 'offer':
            handleOffer(data);
            break;
        case 'answer':
            handleAnswer(data);
            break;
        case 'ice':
            handleIce(data);
            break;
        case 'leave':
            handleLeave(data);
            break;
        case 'call-state':
            handleCallState(data);
            break;
    }
}

// ----- PRESENCE HANDLER -----
function handlePresence(data) {
    // Add or update member
    const existing = state.members.find(m => m.id === data.userId);
    if (!existing) {
        state.members.push({
            id: data.userId,
            name: data.name || 'Unknown',
            inCall: data.inCall || false
        });
        renderMembers();
        state.debug(`👤 ${data.name} joined`);
        
        // If we're in call and they're in call, connect
        if (state.inCall && data.inCall) {
            connectToPeer(data.userId);
        }
    } else {
        const wasInCall = existing.inCall;
        existing.inCall = data.inCall || false;
        renderMembers();
        
        // If they joined call and we're in call, connect
        if (state.inCall && data.inCall && !state.peers.has(data.userId)) {
            connectToPeer(data.userId);
        }
        // If they left call, disconnect
        if (!data.inCall && state.peers.has(data.userId)) {
            disconnectPeer(data.userId);
        }
    }
}

function handleCallState(data) {
    const member = state.members.find(m => m.id === data.userId);
    if (member) {
        member.inCall = data.inCall;
        renderMembers();
    }
}

function handleLeave(data) {
    const member = state.members.find(m => m.id === data.userId);
    if (member) {
        state.debug(`👋 ${member.name} left`);
        state.members = state.members.filter(m => m.id !== data.userId);
        renderMembers();
        disconnectPeer(data.userId);
    }
}

// ----- RENDER MEMBERS -----
function renderMembers() {
    const list = document.getElementById('memberList');
    const count = document.getElementById('memberCount');
    count.textContent = state.members.length;
    
    if (state.members.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#667799;padding:20px;font-size:13px;">No members</div>';
        return;
    }
    
    list.innerHTML = state.members.map(m => `
        <div class="member">
            <div class="name">
                <div class="avatar">${m.name.charAt(0).toUpperCase()}</div>
                ${m.name}
                ${m.id === state.user?.id ? ' (you)' : ''}
            </div>
            <span class="status ${m.inCall ? 'in-call' : ''}">${m.inCall ? '🎙️' : 'away'}</span>
        </div>
    `).join('');
    
    updateParticipantCount();
}

function updateParticipantCount() {
    const inCall = state.members.filter(m => m.inCall).length;
    document.getElementById('participantCount').textContent = inCall;
}

// ----- CALL CONTROLS -----
async function toggleCall() {
    if (state.inCall) {
        leaveCall();
    } else {
        await startCall();
    }
}

async function startCall() {
    try {
        state.debug('🎤 Getting microphone...');
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        state.localStream = stream;
        
        state.inCall = true;
        state.muted = false;
        
        // Update UI
        document.getElementById('callBtn').textContent = '⏹️ End Call';
        document.getElementById('callBtn').classList.add('btn-danger');
        document.getElementById('muteBtn').disabled = false;
        document.getElementById('leaveBtn').disabled = false;
        document.getElementById('callIcon').textContent = '🔊';
        document.getElementById('callStatus').textContent = '🔴 Live';
        document.getElementById('callStatus').classList.add('active');
        
        // Connect to existing members who are in call
        for (const member of state.members) {
            if (member.id !== state.user.id && member.inCall) {
                await connectToPeer(member.id);
            }
        }
        
        // Broadcast presence
        sendPresence();
        sendSignal({
            type: 'call-state',
            userId: state.user.id,
            inCall: true
        });
        
        state.debug('✅ Call started!');
        showToast('📞 Call started!');
        
    } catch(err) {
        state.debug('❌ Mic error: ' + err.message);
        showToast('❌ Cannot access microphone');
        console.error(err);
    }
}

function leaveCall() {
    state.debug('⏹️ Leaving call...');
    
    // Disconnect all peers
    for (const [id, peer] of state.peers) {
        try {
            peer.pc.close();
            if (peer.audio) peer.audio.remove();
        } catch(e) {}
    }
    state.peers.clear();
    
    // Stop local stream
    if (state.localStream) {
        state.localStream.getTracks().forEach(t => t.stop());
        state.localStream = null;
    }
    
    state.inCall = false;
    state.muted = false;
    
    // Update UI
    document.getElementById('callBtn').textContent = '📞 Start Call';
    document.getElementById('callBtn').classList.remove('btn-danger');
    document.getElementById('muteBtn').disabled = true;
    document.getElementById('muteBtn').textContent = '🔊 Mute';
    document.getElementById('muteBtn').classList.remove('muted');
    document.getElementById('leaveBtn').disabled = true;
    document.getElementById('callIcon').textContent = '📞';
    document.getElementById('callStatus').textContent = 'Ready';
    document.getElementById('callStatus').classList.remove('active');
    
    // Broadcast leave
    sendSignal({
        type: 'leave',
        userId: state.user.id
    });
    sendSignal({
        type: 'call-state',
        userId: state.user.id,
        inCall: false
    });
    
    updateParticipantCount();
    state.debug('📴 Call ended');
    showToast('Call ended');
}

function toggleMute() {
    if (!state.localStream) return;
    state.muted = !state.muted;
    state.localStream.getAudioTracks().forEach(t => {
        t.enabled = !state.muted;
    });
    
    const btn = document.getElementById('muteBtn');
    btn.textContent = state.muted ? '🔇 Muted' : '🔊 Mute';
    btn.classList.toggle('muted', state.muted);
}

// ----- PEER CONNECTION -----
async function connectToPeer(peerId) {
    if (peerId === state.user.id) return;
    if (state.peers.has(peerId)) return;
    if (!state.localStream) return;
    
    const member = state.members.find(m => m.id === peerId);
    state.debug(`🔗 Connecting to ${member?.name || peerId}...`);
    
    const pc = new RTCPeerConnection({
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ]
    });
    
    // Add local tracks
    state.localStream.getTracks().forEach(track => {
        pc.addTrack(track, state.localStream);
    });
    
    // Handle remote stream
    pc.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
            const stream = event.streams[0];
            const audio = new Audio();
            audio.srcObject = stream;
            audio.autoplay = true;
            audio.style.display = 'none';
            document.body.appendChild(audio);
            
            state.peers.set(peerId, { 
                pc: pc, 
                audio: audio,
                name: member?.name || peerId
            });
            state.debug(`🔊 Audio from ${member?.name || peerId}`);
            updateParticipantCount();
        }
    };
    
    // ICE candidates
    pc.onicecandidate = (event) => {
        if (event.candidate) {
            sendSignal({
                type: 'ice',
                from: state.user.id,
                to: peerId,
                candidate: event.candidate
            });
        }
    };
    
    // Connection state
    pc.onconnectionstatechange = () => {
        const state = pc.connectionState;
        if (state === 'connected') {
            state.debug(`✅ Connected to ${member?.name || peerId}`);
        } else if (state === 'disconnected' || state === 'failed') {
            state.debug(`❌ Lost connection to ${member?.name || peerId}`);
            disconnectPeer(peerId);
        }
    };
    
    // Create and send offer
    try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        sendSignal({
            type: 'offer',
            from: state.user.id,
            to: peerId,
            sdp: pc.localDescription
        });
    } catch(err) {
        state.debug('❌ Offer error: ' + err.message);
    }
}

function disconnectPeer(peerId) {
    const peer = state.peers.get(peerId);
    if (peer) {
        try {
            peer.pc.close();
            if (peer.audio) peer.audio.remove();
        } catch(e) {}
        state.peers.delete(peerId);
        state.debug(`🔌 Disconnected from ${peer.name || peerId}`);
        updateParticipantCount();
    }
}

// ----- OFFER/ANSWER HANDLERS -----
async function handleOffer(data) {
    if (data.to !== state.user.id) return;
    if (state.peers.has(data.from)) return;
    if (!state.localStream) {
        // Wait for stream
        setTimeout(() => handleOffer(data), 500);
        return;
    }
    
    const member = state.members.find(m => m.id === data.from);
    state.debug(`📨 Offer from ${member?.name || data.from}`);
    
    const pc = new RTCPeerConnection({
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ]
    });
    
    state.localStream.getTracks().forEach(track => {
        pc.addTrack(track, state.localStream);
    });
    
    pc.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
            const stream = event.streams[0];
            const audio = new Audio();
            audio.srcObject = stream;
            audio.autoplay = true;
            audio.style.display = 'none';
            document.body.appendChild(audio);
            
            state.peers.set(data.from, { 
                pc: pc, 
                audio: audio,
                name: member?.name || data.from
            });
            state.debug(`🔊 Audio from ${member?.name || data.from}`);
            updateParticipantCount();
        }
    };
    
    pc.onicecandidate = (event) => {
        if (event.candidate) {
            sendSignal({
                type: 'ice',
                from: state.user.id,
                to: data.from,
                candidate: event.candidate
            });
        }
    };
    
    try {
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendSignal({
            type: 'answer',
            from: state.user.id,
            to: data.from,
            sdp: pc.localDescription
        });
    } catch(err) {
        state.debug('❌ Answer error: ' + err.message);
    }
}

async function handleAnswer(data) {
    if (data.to !== state.user.id) return;
    const peer = state.peers.get(data.from);
    if (!peer) return;
    
    try {
        await peer.pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        state.debug(`✅ Answer from ${data.from}`);
    } catch(err) {
        state.debug('❌ Set answer error: ' + err.message);
    }
}

async function handleIce(data) {
    if (data.to !== state.user.id) return;
    const peer = state.peers.get(data.from);
    if (!peer) return;
    
    try {
        await peer.pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    } catch(err) {
        // Ignore ICE errors
    }
}

// ----- TOAST -----
function showToast(msg) {
    let toast = document.querySelector('.toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.className = 'toast';
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { toast.style.display = 'none'; }, 3000);
}
