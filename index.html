<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC P2P Voice Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #0b1a2e, #1a2f44);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 1.5rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 3.5rem;
            padding: 2.5rem 2.8rem;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        h1 {
            font-weight: 400;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
            color: #d6e6ff;
            text-align: center;
            margin-bottom: 0.2rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 300;
            background: rgba(70, 130, 200, 0.3);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            color: #b0d0ff;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .sub {
            text-align: center;
            color: #8aa9d9;
            margin-bottom: 2.5rem;
            font-weight: 300;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            border-bottom: 1px dashed rgba(255,255,255,0.06);
            padding-bottom: 1.2rem;
        }
        .status-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 60px;
            padding: 0.65rem 1.6rem;
            margin: 0 auto 1.8rem auto;
            width: fit-content;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
        }
        .led {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            background: #4a6f8f;
            box-shadow: 0 0 8px #1f3b4f;
            transition: 0.25s;
        }
        .led.active {
            background: #3ddc84;
            box-shadow: 0 0 16px #3ddc84aa;
        }
        .led.muted {
            background: #f5a623;
            box-shadow: 0 0 12px #f5a623aa;
        }
        #statusText {
            color: #c6dbf5;
            font-weight: 400;
            font-size: 1rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            margin: 2rem 0 1.5rem;
        }
        .btn {
            background: rgba(30, 50, 80, 0.6);
            border: none;
            border-radius: 60px;
            padding: 0.9rem 1.8rem;
            font-size: 1rem;
            font-weight: 500;
            color: #e0eeff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: 0.18s;
            flex: 1 0 auto;
            min-width: 130px;
            letter-spacing: 0.3px;
        }
        .btn:hover:not(:disabled) {
            background: rgba(60, 100, 160, 0.6);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            filter: grayscale(0.5);
        }
        .btn.primary {
            background: #2b6c9e;
            border-color: #5c9eff;
            color: white;
            font-weight: 600;
        }
        .btn.primary:hover:not(:disabled) {
            background: #3a7fb8;
        }
        .btn.danger {
            background: #a04040;
            border-color: #d47070;
        }
        .btn.danger:hover:not(:disabled) {
            background: #c05050;
        }
        .btn.success {
            background: #2d7a4b;
            border-color: #5fcb8a;
        }
        .btn.success:hover:not(:disabled) {
            background: #3b9660;
        }
        .sdp-area {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 2rem;
            padding: 1.2rem 1.2rem 0.8rem;
            margin: 1.5rem 0 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .sdp-label {
            color: #94b4df;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        textarea {
            width: 100%;
            background: rgba(10, 20, 35, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.2rem;
            padding: 0.9rem 1.2rem;
            color: #d0e2ff;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            resize: vertical;
            min-height: 80px;
            outline: none;
            transition: 0.15s;
            backdrop-filter: blur(2px);
        }
        textarea:focus {
            border-color: #4a8fd0;
            box-shadow: 0 0 0 3px rgba(70, 130, 200, 0.2);
        }
        .actions-sdp {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 12px;
        }
        .btn.small {
            padding: 0.4rem 1.2rem;
            font-size: 0.8rem;
            flex: 0 1 auto;
            background: rgba(30, 50, 80, 0.5);
        }
        .btn.small:hover {
            background: rgba(60, 100, 160, 0.6);
        }
        .mute-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4a6f8f;
            margin-right: 6px;
        }
        .footer {
            margin-top: 2rem;
            text-align: center;
            color: #4f749b;
            font-size: 0.75rem;
            opacity: 0.6;
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(255,255,255,0.03);
            padding-top: 1.5rem;
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="card" role="main">
        <h1>
            🎙️ P2P Voice
            <small>WebRTC</small>
        </h1>
        <div class="sub">🔗 direct browser-to-browser · no server</div>

        <div class="status-badge">
            <span class="led" id="connectionLed"></span>
            <span id="statusText">⚡ Disconnected</span>
        </div>

        <div class="controls">
            <button class="btn primary" id="startCallBtn">📞 Start Call</button>
            <button class="btn danger" id="hangupBtn" disabled>⏹️ Hang up</button>
            <button class="btn success" id="muteBtn" disabled>🔊 Mute</button>
        </div>

        <!-- SDP exchange panel -->
        <div class="sdp-area">
            <div class="sdp-label">
                <span>📋 SDP offer / answer</span>
                <span style="font-weight:300; opacity:0.6;">copy & paste to peer</span>
            </div>
            <textarea id="sdpTextarea" placeholder="Paste remote SDP here, or copy your local SDP…" spellcheck="false"></textarea>
            <div class="actions-sdp">
                <button class="btn small" id="copySdpBtn">📄 Copy local SDP</button>
                <button class="btn small primary" id="applyRemoteSdpBtn">📥 Apply remote SDP</button>
            </div>
        </div>

        <div class="footer">
            <span id="peerInfo">🔒 peer: none</span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ----- DOM refs -----
            const statusText = document.getElementById('statusText');
            const connectionLed = document.getElementById('connectionLed');
            const startCallBtn = document.getElementById('startCallBtn');
            const hangupBtn = document.getElementById('hangupBtn');
            const muteBtn = document.getElementById('muteBtn');
            const sdpTextarea = document.getElementById('sdpTextarea');
            const copySdpBtn = document.getElementById('copySdpBtn');
            const applyRemoteSdpBtn = document.getElementById('applyRemoteSdpBtn');
            const peerInfo = document.getElementById('peerInfo');

            // ----- WebRTC state -----
            let localStream = null;
            let remoteStream = null;
            let peerConnection = null;
            let isCallActive = false;
            let isMuted = false;

            // STUN servers (public)
            const rtcConfig = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            };

            // ----- Helper: update UI -----
            function updateUI() {
                const active = isCallActive;
                startCallBtn.disabled = active;
                hangupBtn.disabled = !active;
                muteBtn.disabled = !active;
                connectionLed.className = 'led' + (active ? ' active' : '');
                statusText.innerText = active ? (isMuted ? '🔇 Muted' : '🎙️ Connected') : '⚡ Disconnected';
                if (active && isMuted) {
                    connectionLed.className = 'led muted';
                }
                peerInfo.innerText = active ? '🔗 peer: connected' : '🔒 peer: none';
                // update mute button text
                muteBtn.innerHTML = isMuted ? '🔇 Unmute' : '🔊 Mute';
            }

            // ----- close peer connection & cleanup -----
            function closeConnection() {
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                if (remoteStream) {
                    remoteStream.getTracks().forEach(track => track.stop());
                    remoteStream = null;
                }
                isCallActive = false;
                isMuted = false;
                updateUI();
                // clear SDP area (optional)
                sdpTextarea.value = '';
                // remove event listeners? we recreate peerConnection each time.
            }

            // ----- create peer connection with handlers -----
            function createPeerConnection() {
                const pc = new RTCPeerConnection(rtcConfig);

                // when ICE candidates are gathered, put them into SDP textarea
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        // we collect all candidates, but we prefer to update after gathering complete.
                        // but we can also update progressively.
                        // we update the textarea with the current SDP (including candidates)
                        const sdp = pc.localDescription?.sdp;
                        if (sdp) {
                            sdpTextarea.value = sdp;
                        }
                    } else {
                        // ice gathering complete
                        const sdp = pc.localDescription?.sdp;
                        if (sdp) {
                            sdpTextarea.value = sdp;
                        }
                    }
                };

                // when remote stream arrives
                pc.ontrack = (event) => {
                    if (event.streams && event.streams.length > 0) {
                        remoteStream = event.streams[0];
                        // attach to audio element (we can play it)
                        const audioEl = document.getElementById('remoteAudio');
                        if (!audioEl) {
                            const newAudio = document.createElement('audio');
                            newAudio.id = 'remoteAudio';
                            newAudio.autoplay = true;
                            newAudio.style.display = 'none';
                            document.body.appendChild(newAudio);
                            newAudio.srcObject = remoteStream;
                        } else {
                            audioEl.srcObject = remoteStream;
                            audioEl.autoplay = true;
                        }
                        console.log('✅ Remote stream attached');
                    }
                };

                // connection state change
                pc.onconnectionstatechange = () => {
                    const state = pc.connectionState;
                    console.log('Connection state:', state);
                    if (state === 'connected') {
                        isCallActive = true;
                        updateUI();
                    } else if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                        // if disconnected, cleanup
                        if (isCallActive) {
                            closeConnection();
                        }
                    }
                };

                pc.oniceconnectionstatechange = () => {
                    const state = pc.iceConnectionState;
                    if (state === 'connected' || state === 'completed') {
                        // ensure active
                        if (!isCallActive) {
                            isCallActive = true;
                            updateUI();
                        }
                    }
                };

                return pc;
            }

            // ----- get local audio stream -----
            async function getLocalAudio() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    return stream;
                } catch (err) {
                    console.error('❌ getUserMedia error:', err);
                    alert('Could not access microphone. Please allow microphone access and try again.');
                    return null;
                }
            }

            // ----- start call (initiator) -----
            async function startCall() {
                if (isCallActive) {
                    console.warn('Call already active');
                    return;
                }

                // get local stream
                const stream = await getLocalAudio();
                if (!stream) return;
                localStream = stream;

                // create peer connection
                const pc = createPeerConnection();
                peerConnection = pc;

                // add local tracks
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });

                // create offer
                try {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    // after setLocalDescription, ice candidates will be gathered and onicecandidate will update textarea
                    sdpTextarea.value = pc.localDescription.sdp;
                    // set state: waiting for answer
                    isCallActive = false; // not yet connected
                    updateUI();
                    statusText.innerText = '📤 Waiting for answer…';
                } catch (err) {
                    console.error('Create offer error:', err);
                    closeConnection();
                }
            }

            // ----- apply remote SDP (answer or offer) -----
            async function applyRemoteSdp() {
                if (!peerConnection) {
                    // if no peer connection, create one (as callee) but we need local stream first
                    // if we are not initiator, we need to get local stream and create peer connection.
                    if (!localStream) {
                        const stream = await getLocalAudio();
                        if (!stream) return;
                        localStream = stream;
                    }
                    const pc = createPeerConnection();
                    peerConnection = pc;
                    // add tracks
                    localStream.getTracks().forEach(track => {
                        pc.addTrack(track, localStream);
                    });
                }

                const sdpText = sdpTextarea.value.trim();
                if (!sdpText) {
                    alert('Please paste the remote SDP (offer or answer) into the textarea.');
                    return;
                }

                try {
                    // determine type: if remote SDP contains 'a=setup:active' or 'a=setup:passive'? we can check.
                    // simpler: if we have local description, we are initiator -> we expect answer.
                    // else we expect offer.
                    const isInitiator = !!peerConnection.localDescription;
                    const sdpType = isInitiator ? 'answer' : 'offer';
                    const remoteDesc = new RTCSessionDescription({
                        type: sdpType,
                        sdp: sdpText
                    });

                    await peerConnection.setRemoteDescription(remoteDesc);
                    console.log(`✅ Remote ${sdpType} set`);

                    if (!isInitiator) {
                        // if we are callee, we need to create answer
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        sdpTextarea.value = peerConnection.localDescription.sdp;
                        statusText.innerText = '📤 SDP answer ready, send to peer';
                        // we are not connected yet, but waiting for ICE
                    } else {
                        // initiator: remote answer set, ICE will connect
                        statusText.innerText = '⏳ Connecting…';
                    }
                    // update UI but connection not active until ICE connects
                    updateUI();
                } catch (err) {
                    console.error('Error applying remote SDP:', err);
                    alert('Failed to apply remote SDP. Check if it is a valid offer/answer.');
                }
            }

            // ----- mute / unmute -----
            function toggleMute() {
                if (!isCallActive || !localStream) return;
                isMuted = !isMuted;
                localStream.getAudioTracks().forEach(track => {
                    track.enabled = !isMuted;
                });
                updateUI();
            }

            // ----- hangup -----
            function hangup() {
                closeConnection();
                // reset SDP area
                sdpTextarea.value = '';
                // also remove audio element
                const audioEl = document.getElementById('remoteAudio');
                if (audioEl) audioEl.remove();
                statusText.innerText = '⚡ Disconnected';
                updateUI();
            }

            // ----- copy SDP to clipboard -----
            function copySdp() {
                const sdp = sdpTextarea.value;
                if (!sdp) {
                    alert('No SDP to copy. Start a call or generate offer first.');
                    return;
                }
                navigator.clipboard.writeText(sdp).then(() => {
                    alert('SDP copied to clipboard!');
                }).catch(() => {
                    // fallback
                    sdpTextarea.select();
                    document.execCommand('copy');
                    alert('SDP copied!');
                });
            }

            // ----- init event listeners -----
            function init() {
                startCallBtn.addEventListener('click', startCall);
                hangupBtn.addEventListener('click', hangup);
                muteBtn.addEventListener('click', toggleMute);
                copySdpBtn.addEventListener('click', copySdp);
                applyRemoteSdpBtn.addEventListener('click', applyRemoteSdp);

                // initial UI
                updateUI();
                // add a hidden audio element for remote stream if not exists
                if (!document.getElementById('remoteAudio')) {
                    const audio = document.createElement('audio');
                    audio.id = 'remoteAudio';
                    audio.autoplay = true;
                    audio.style.display = 'none';
                    document.body.appendChild(audio);
                }

                // Cleanup on page unload
                window.addEventListener('beforeunload', () => {
                    closeConnection();
                });
            }

            // start
            init();
        })();
    </script>
</body>
</html>
