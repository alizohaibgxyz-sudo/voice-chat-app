<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Voice Call</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #e0e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #141b2b;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c8cff, #3ddc84);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: #1a2744;
            border-radius: 20px;
            font-size: 12px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.connected { background: #3ddc84; }
        .status-dot.connecting { background: #f5a623; }
        .status-dot.disconnected { background: #666; }
        
        .room-badge {
            background: #1a2744;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-badge {
            background: #1a2744;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 16px;
        }
        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; }
        }
        
        .call-panel {
            background: #0f1625;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }
        .call-icon { font-size: 56px; margin-bottom: 12px; display: block; }
        .call-status { font-size: 18px; color: #8899bb; }
        .call-status.active { color: #3ddc84; }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a2744;
            color: #b0c4e8;
        }
        .btn:hover { transform: scale(1.03); filter: brightness(1.15); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .btn-primary { background: #2b6c9e; color: white; }
        .btn-danger { background: #8a2a2a; color: #ff8888; }
        .btn-mute { background: #2a3a5a; }
        .btn-mute.muted { background: #f5a623; color: #000; }
        .btn-success { background: #2d7a4b; color: white; }
        
        .members-panel {
            background: #0f1625;
            border-radius: 16px;
            padding: 16px;
            max-height: 500px;
            overflow-y: auto;
        }
        .members-panel h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #667799;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        .member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
            transition: all 0.3s;
            border: 2px solid transparent;
            flex-wrap: wrap;
            gap: 6px;
        }
        .member-item.speaking {
            border-color: #3ddc84;
            box-shadow: 0 0 20px rgba(61, 220, 132, 0.2);
            background: rgba(61, 220, 132, 0.05);
        }
        .member-item .info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .member-item .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a4a7a, #4a2a7a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
        }
        .member-item .name {
            font-size: 14px;
            font-weight: 500;
        }
        .member-item .status {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 10px;
            background: #1a2744;
        }
        .member-item .status.in-call { background: #3ddc84; color: #000; }
        .member-item .volume-control {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .member-item .volume-control input[type="range"] {
            width: 50px;
            height: 4px;
            -webkit-appearance: none;
            background: #2a3a5a;
            border-radius: 2px;
            outline: none;
        }
        .member-item .volume-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #6c8cff;
            cursor: pointer;
        }
        .member-item .speaking-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3ddc84;
            display: none;
            animation: pulse 0.8s ease-in-out infinite;
        }
        .member-item.speaking .speaking-indicator {
            display: inline-block;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }
        
        .login-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-box {
            background: #141b2b;
            padding: 40px;
            border-radius: 24px;
            max-width: 380px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .login-box h2 { margin-bottom: 8px; }
        .login-box p { color: #8899bb; margin-bottom: 20px; font-size: 14px; }
        .login-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #0a0e1a;
            color: #e0e8f0;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .login-input:focus { outline: none; border-color: #6c8cff; }
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6c8cff, #3ddc84);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-btn:hover { transform: scale(1.02); }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2744;
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 999;
            font-size: 14px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        
        .connection-status {
            font-size: 12px;
            color: #667799;
            margin-top: 8px;
            padding: 6px;
            background: #0a0e1a;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h2>🎙️ Group Call</h2>
        <p>Enter your name and room number</p>
        <input type="text" id="loginName" class="login-input" placeholder="Your name..." maxlength="20" autofocus>
        <input type="text" id="loginRoom" class="login-input" placeholder="Room number (e.g., 1234)" maxlength="10" value="1234">
        <input type="text" id="serverUrl" class="login-input" placeholder="Server URL" value="ws://localhost:8080" style="font-size:13px;">
        <button class="login-btn" onclick="login()">🎤 Join Room</button>
        <div style="margin-top:12px;font-size:12px;color:#667799;text-align:center;">
            Share room number with friends to connect
        </div>
    </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">
    <div class="container">
        <div class="header">
            <div class="logo">🎙️ GroupCall</div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                <span class="status-badge">
                    <span class="status-dot" id="connectionDot"></span>
                    <span id="connectionText">Connecting...</span>
                </span>
                <span class="room-badge">🏠 Room #<span id="roomDisplay">0000</span></span>
                <span class="user-badge">
                    <span id="currentUserName">You</span>
                    <button onclick="logout()" style="background:none;border:none;color:#667799;cursor:pointer;margin-left:8px;">✕</button>
                </span>
            </div>
        </div>
        
        <div class="grid">
            <div class="call-panel">
                <span class="call-icon" id="callIcon">📞</span>
                <div class="call-status" id="callStatus">Ready</div>
                
                <div class="controls">
                    <button class="btn btn-primary" id="callBtn" onclick="toggleCall()">📞 Start Call</button>
                    <button class="btn btn-mute" id="muteBtn" onclick="toggleMute()" disabled>🔊 Mute</button>
                    <button class="btn btn-danger" id="leaveBtn" onclick="leaveCall()" disabled>Leave</button>
                </div>
                
                <div style="margin-top:12px;font-size:13px;color:#667799;">
                    👥 <span id="participantCount">0</span> in call
                </div>
                
                <div class="connection-status" id="connectionStatus">⚡ Connected to server</div>
            </div>
            
            <div class="members-panel">
                <h3>
                    👥 Members
                    <span id="memberCount">0</span>
                </h3>
                <div id="memberList">
                    <div style="text-align:center;color:#667799;padding:20px;font-size:13px;">
                        No members in this room
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 🚀 FULLY WORKING GROUP CALL WITH WEBSOCKET SERVER
// ============================================================

// ----- STATE -----
const state = {
    user: null,
    room: null,
    inCall: false,
    muted: false,
    localStream: null,
    peers: new Map(),
    members: [],
    ws: null,
    connected: false,
    debug: (msg) => {
        console.log('🔵', msg);
        const el = document.getElementById('connectionStatus');
        if (el) el.textContent = msg;
    }
};

// ----- LOGIN -----
function login() {
    const nameInput = document.getElementById('loginName');
    const roomInput = document.getElementById('loginRoom');
    const serverInput = document.getElementById('serverUrl');
    
    const name = nameInput.value.trim() || 'User_' + Math.floor(Math.random() * 1000);
    const room = roomInput.value.trim() || '1234';
    const serverUrl = serverInput.value.trim() || 'ws://localhost:8080';
    
    state.user = {
        id: 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        name: name
    };
    state.room = room;
    
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('currentUserName').textContent = name;
    document.getElementById('roomDisplay').textContent = room;
    
    state.debug('👋 Connecting to server...');
    
    connectWebSocket(serverUrl);
}

function logout() {
    leaveCall();
    if (state.ws) {
        state.ws.close();
        state.ws = null;
    }
    state.user = null;
    state.room = null;
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
}

// ----- WEBSOCKET CONNECTION -----
function connectWebSocket(url) {
    try {
        state.ws = new WebSocket(url);
        
        state.ws.onopen = () => {
            state.connected = true;
            state.debug('✅ Connected to server');
            document.getElementById('connectionDot').className = 'status-dot connected';
            document.getElementById('connectionText').textContent = 'Connected';
            
            // Join room
            sendToServer({
                type: 'join',
                userId: state.user.id,
                name: state.user.name,
                roomId: state.room,
                inCall: state.inCall
            });
        };
        
        state.ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                handleServerMessage(data);
            } catch(e) {
                console.error('Invalid message:', e);
            }
        };
        
        state.ws.onclose = () => {
            state.connected = false;
            state.debug('❌ Disconnected from server');
            document.getElementById('connectionDot').className = 'status-dot disconnected';
            document.getElementById('connectionText').textContent = 'Disconnected';
            
            // Try to reconnect after 3 seconds
            setTimeout(() => {
                if (!state.connected && state.user) {
                    state.debug('🔄 Reconnecting...');
                    connectWebSocket(url);
                }
            }, 3000);
        };
        
        state.ws.onerror = (error) => {
            state.debug('⚠️ WebSocket error: ' + error.message);
        };
        
    } catch(e) {
        state.debug('❌ Failed to connect: ' + e.message);
        showToast('❌ Cannot connect to server');
    }
}

function sendToServer(data) {
    if (state.ws && state.ws.readyState === WebSocket.OPEN) {
        state.ws.send(JSON.stringify(data));
    }
}

// ----- HANDLE SERVER MESSAGES -----
function handleServerMessage(data) {
    switch(data.type) {
        case 'joined':
            state.debug('✅ Joined room ' + data.roomId);
            break;
            
        case 'members':
            // Add existing members
            data.members.forEach(m => {
                if (m.userId !== state.user.id) {
                    addMember(m.userId, m.name, m.inCall || false);
                }
            });
            break;
            
        case 'presence':
            if (data.userId !== state.user.id) {
                handlePresence(data);
            }
            break;
            
        case 'call-state':
            if (data.userId !== state.user.id) {
                handleCallState(data);
            }
            break;
            
        case 'speaking':
            if (data.userId !== state.user.id) {
                handleSpeaking(data);
            }
            break;
            
        case 'offer':
        case 'answer':
        case 'ice':
            if (data.to === state.user.id) {
                handlePeerMessage(data);
            }
            break;
            
        case 'leave':
            if (data.userId !== state.user.id) {
                handleLeave(data);
            }
            break;
    }
}

// ----- PRESENCE HANDLING -----
function handlePresence(data) {
    const existing = state.members.find(m => m.id === data.userId);
    if (!existing) {
        addMember(data.userId, data.name, data.inCall || false);
        state.debug(`👤 ${data.name} joined`);
        
        if (state.inCall && data.inCall) {
            connectToPeer(data.userId);
        }
    } else {
        existing.inCall = data.inCall || false;
        renderMembers();
        
        if (state.inCall && data.inCall && !state.peers.has(data.userId)) {
            connectToPeer(data.userId);
        }
        if (!data.inCall && state.peers.has(data.userId)) {
            disconnectPeer(data.userId);
        }
    }
}

function handleCallState(data) {
    const member = state.members.find(m => m.id === data.userId);
    if (member) {
        member.inCall = data.inCall;
        renderMembers();
    }
}

function handleSpeaking(data) {
    const items = document.querySelectorAll('.member-item');
    items.forEach(el => {
        if (el.dataset.userId === data.userId) {
            if (data.speaking) {
                el.classList.add('speaking');
            } else {
                el.classList.remove('speaking');
            }
        }
    });
}

function handleLeave(data) {
    const member = state.members.find(m => m.id === data.userId);
    if (member) {
        state.debug(`👋 ${member.name} left`);
        state.members = state.members.filter(m => m.id !== data.userId);
        renderMembers();
        disconnectPeer(data.userId);
    }
}

function handlePeerMessage(data) {
    switch(data.type) {
        case 'offer':
            handleOffer(data);
            break;
        case 'answer':
            handleAnswer(data);
            break;
        case 'ice':
            handleIce(data);
            break;
    }
}

// ----- MEMBER MANAGEMENT -----
function addMember(id, name, inCall) {
    state.members.push({ id, name, inCall });
    renderMembers();
}

function renderMembers() {
    const list = document.getElementById('memberList');
    const count = document.getElementById('memberCount');
    count.textContent = state.members.length;
    
    if (state.members.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#667799;padding:20px;font-size:13px;">No members in this room</div>';
        return;
    }
    
    list.innerHTML = state.members.map(m => `
        <div class="member-item" data-user-id="${m.id}">
            <div class="info">
                <div class="avatar">${m.name.charAt(0).toUpperCase()}</div>
                <span class="name">${m.name}</span>
                <span class="speaking-indicator"></span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <span class="status ${m.inCall ? 'in-call' : ''}">${m.inCall ? '🎙️' : 'away'}</span>
                ${m.id !== state.user?.id ? `
                    <div class="volume-control">
                        <input type="range" min="0" max="100" value="100" 
                               onchange="setVolume('${m.id}', this.value)"
                               oninput="setVolume('${m.id}', this.value)">
                    </div>
                ` : ''}
            </div>
        </div>
    `).join('');
    
    updateParticipantCount();
    
    // Restore volume settings
    state.peers.forEach((peer, id) => {
        const volInput = document.querySelector(`.member-item[data-user-id="${id}"] input[type="range"]`);
        if (volInput && peer.volume !== undefined) {
            volInput.value = peer.volume * 100;
        }
    });
}

function updateParticipantCount() {
    const inCall = state.members.filter(m => m.inCall).length;
    document.getElementById('participantCount').textContent = inCall;
}

// ----- VOLUME CONTROL -----
function setVolume(userId, value) {
    const volume = parseInt(value) / 100;
    const peer = state.peers.get(userId);
    if (peer && peer.audio) {
        peer.audio.volume = volume;
        peer.volume = volume;
    }
}

// ----- SPEAKER DETECTION -----
function startSpeakerDetection() {
    if (!state.localStream) return;
    
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    const source = audioContext.createMediaStreamSource(state.localStream);
    source.connect(analyser);
    
    const dataArray = new Uint8Array(analyser.fftSize);
    let speakingTimeout = null;
    let wasSpeaking = false;
    
    function detectSpeech() {
        if (!state.inCall) return;
        
        analyser.getByteTimeDomainData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
            const value = (dataArray[i] - 128) / 128;
            sum += value * value;
        }
        const rms = Math.sqrt(sum / dataArray.length);
        const isSpeaking = rms > 0.03;
        
        if (isSpeaking && !wasSpeaking) {
            wasSpeaking = true;
            sendToServer({
                type: 'speaking',
                userId: state.user.id,
                speaking: true
            });
            const items = document.querySelectorAll('.member-item');
            items.forEach(el => {
                if (el.dataset.userId === state.user.id) {
                    el.classList.add('speaking');
                }
            });
            clearTimeout(speakingTimeout);
        } else if (!isSpeaking && wasSpeaking) {
            wasSpeaking = false;
            clearTimeout(speakingTimeout);
            speakingTimeout = setTimeout(() => {
                sendToServer({
                    type: 'speaking',
                    userId: state.user.id,
                    speaking: false
                });
                const items = document.querySelectorAll('.member-item');
                items.forEach(el => {
                    if (el.dataset.userId === state.user.id) {
                        el.classList.remove('speaking');
                    }
                });
            }, 300);
        }
        
        requestAnimationFrame(detectSpeech);
    }
    
    detectSpeech();
    state._audioContext = audioContext;
}

// ----- CALL CONTROLS -----
async function toggleCall() {
    if (state.inCall) {
        leaveCall();
    } else {
        await startCall();
    }
}

async function startCall() {
    try {
        state.debug('🎤 Getting microphone...');
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        state.localStream = stream;
        
        state.inCall = true;
        state.muted = false;
        
        document.getElementById('callBtn').textContent = '⏹️ End Call';
        document.getElementById('callBtn').classList.add('btn-danger');
        document.getElementById('muteBtn').disabled = false;
        document.getElementById('leaveBtn').disabled = false;
        document.getElementById('callIcon').textContent = '🔊';
        document.getElementById('callStatus').textContent = '🔴 Live';
        document.getElementById('callStatus').classList.add('active');
        
        startSpeakerDetection();
        
        // Connect to existing members
        for (const member of state.members) {
            if (member.id !== state.user.id && member.inCall) {
                await connectToPeer(member.id);
            }
        }
        
        // Broadcast call state
        sendToServer({
            type: 'call-state',
            userId: state.user.id,
            inCall: true
        });
        
        state.debug('✅ Call started!');
        showToast('📞 Call started!');
        
    } catch(err) {
        state.debug('❌ Mic error: ' + err.message);
        showToast('❌ Cannot access microphone');
        console.error(err);
    }
}

function leaveCall() {
    state.debug('⏹️ Leaving call...');
    
    // Disconnect all peers
    for (const [id, peer] of state.peers) {
        try {
            peer.pc.close();
            if (peer.audio) {
                peer.audio.srcObject = null;
                peer.audio.remove();
            }
        } catch(e) {}
    }
    state.peers.clear();
    
    if (state.localStream) {
        state.localStream.getTracks().forEach(t => t.stop());
        state.localStream = null;
    }
    
    if (state._audioContext) {
        state._audioContext.close();
        state._audioContext = null;
    }
    
    state.inCall = false;
    state.muted = false;
    
    document.getElementById('callBtn').textContent = '📞 Start Call';
    document.getElementById('callBtn').classList.remove('btn-danger');
    document.getElementById('muteBtn').disabled = true;
    document.getElementById('muteBtn').textContent = '🔊 Mute';
    document.getElementById('muteBtn').classList.remove('muted');
    document.getElementById('leaveBtn').disabled = true;
    document.getElementById('callIcon').textContent = '📞';
    document.getElementById('callStatus').textContent = 'Ready';
    document.getElementById('callStatus').classList.remove('active');
    
    sendToServer({
        type: 'call-state',
        userId: state.user.id,
        inCall: false
    });
    
    document.querySelectorAll('.member-item.speaking').forEach(el => {
        el.classList.remove('speaking');
    });
    
    updateParticipantCount();
    state.debug('📴 Call ended');
    showToast('Call ended');
}

function toggleMute() {
    if (!state.localStream) return;
    state.muted = !state.muted;
    state.localStream.getAudioTracks().forEach(t => {
        t.enabled = !state.muted;
    });
    
    const btn = document.getElementById('muteBtn');
    btn.textContent = state.muted ? '🔇 Muted' : '🔊 Mute';
    btn.classList.toggle('muted', state.muted);
}

// ----- PEER CONNECTION (WebRTC) -----
async function connectToPeer(peerId) {
    if (peerId === state.user.id) return;
    if (state.peers.has(peerId)) return;
    if (!state.localStream) return;
    
    const member = state.members.find(m => m.id === peerId);
    state.debug(`🔗 Connecting to ${member?.name || peerId}...`);
    
    const pc = new RTCPeerConnection({
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' }
        ]
    });
    
    state.localStream.getTracks().forEach(track => {
        pc.addTrack(track, state.localStream);
    });
    
    pc.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
            const stream = event.streams[0];
            const audio = new Audio();
            audio.srcObject = stream;
            audio.autoplay = true;
            audio.style.display = 'none';
            audio.volume = 1.0;
            document.body.appendChild(audio);
            
            state.peers.set(peerId, { 
                pc: pc, 
                audio: audio,
                name: member?.name || peerId,
                volume: 1.0
            });
            state.debug(`🔊 Audio from ${member?.name || peerId}`);
            updateParticipantCount();
            
            // Restore volume
            const volInput = document.querySelector(`.member-item[data-user-id="${peerId}"] input[type="range"]`);
            if (volInput) {
                const val = parseInt(volInput.value) / 100;
                audio.volume = val;
                state.peers.get(peerId).volume = val;
            }
        }
    };
    
    pc.onicecandidate = (event) => {
        if (event.candidate) {
            sendToServer({
                type: 'ice',
                from: state.user.id,
                to: peerId,
                candidate: event.candidate
            });
        }
    };
    
    pc.onconnectionstatechange = () => {
        const connState = pc.connectionState;
        if (connState === 'connected') {
            state.debug(`✅ Connected to ${member?.name || peerId}`);
        } else if (connState === 'disconnected' || connState === 'failed') {
            state.debug(`❌ Lost connection to ${member?.name || peerId}`);
            disconnectPeer(peerId);
        }
    };
    
    try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        sendToServer({
            type: 'offer',
            from: state.user.id,
            to: peerId,
            sdp: pc.localDescription
        });
    } catch(err) {
        state.debug('❌ Offer error: ' + err.message);
    }
}

function disconnectPeer(peerId) {
    const peer = state.peers.get(peerId);
    if (peer) {
        try {
            peer.pc.close();
            if (peer.audio) {
                peer.audio.srcObject = null;
                peer.audio.remove();
            }
        } catch(e) {}
        state.peers.delete(peerId);
        state.debug(`🔌 Disconnected from ${peer.name || peerId}`);
        updateParticipantCount();
    }
    document.querySelectorAll(`.member-item[data-user-id="${peerId}"]`).forEach(el => {
        el.classList.remove('speaking');
    });
}

// ----- OFFER/ANSWER HANDLERS -----
async function handleOffer(data) {
    if (data.to !== state.user.id) return;
    if (state.peers.has(data.from)) return;
    if (!state.localStream) {
        setTimeout(() => handleOffer(data), 500);
        return;
    }
    
    const member = state.members.find(m => m.id === data.from);
    state.debug(`📨 Offer from ${member?.name || data.from}`);
    
    const pc = new RTCPeerConnection({
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ]
    });
    
    state.localStream.getTracks().forEach(track => {
        pc.addTrack(track, state.localStream);
    });
    
    pc.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
            const stream = event.streams[0];
            const audio = new Audio();
            audio.srcObject = stream;
            audio.autoplay = true;
            audio.style.display = 'none';
            audio.volume = 1.0;
            document.body.appendChild(audio);
            
            state.peers.set(data.from, { 
                pc: pc, 
                audio: audio,
                name: member?.name || data.from,
                volume: 1.0
            });
            state.debug(`🔊 Audio from ${member?.name || data.from}`);
            updateParticipantCount();
            
            const volInput = document.querySelector(`.member-item[data-user-id="${data.from}"] input[type="range"]`);
            if (volInput) {
                const val = parseInt(volInput.value) / 100;
                audio.volume = val;
                state.peers.get(data.from).volume = val;
            }
        }
    };
    
    pc.onicecandidate = (event) => {
        if (event.candidate) {
            sendToServer({
                type: 'ice',
                from: state.user.id,
                to: data.from,
                candidate: event.candidate
            });
        }
    };
    
    try {
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendToServer({
            type: 'answer',
            from: state.user.id,
            to: data.from,
            sdp: pc.localDescription
        });
    } catch(err) {
        state.debug('❌ Answer error: ' + err.message);
    }
}

async function handleAnswer(data) {
    if (data.to !== state.user.id) return;
    const peer = state.peers.get(data.from);
    if (!peer) return;
    
    try {
        await peer.pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        state.debug(`✅ Answer from ${data.from}`);
    } catch(err) {
        state.debug('❌ Set answer error: ' + err.message);
    }
}

async function handleIce(data) {
    if (data.to !== state.user.id) return;
    const peer = state.peers.get(data.from);
    if (!peer) return;
    
    try {
        await peer.pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    } catch(err) {}
}

// ----- TOAST -----
function showToast(msg) {
    let toast = document.querySelector('.toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.className = 'toast';
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

    const port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
    document.getElementById('serverUrl').value = `${protocol}//${host}:${port}`;
});
