<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Voice Call</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #e0e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app-container {
            width: 100%;
            max-width: 900px;
            background: #141b2b;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .logo {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, #6c8cff, #3ddc84);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-badge {
            background: #2a3a5a;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.online { background: #3ddc84; }
        .status-dot.offline { background: #666; }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }
        @media (max-width: 700px) {
            .main-grid { grid-template-columns: 1fr; }
        }
        
        .call-section {
            background: #0f1625;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .call-status {
            text-align: center;
            padding: 30px 0;
        }
        .call-status .icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
        .call-status .status-text {
            font-size: 18px;
            color: #8899bb;
        }
        .call-status .status-text.active {
            color: #3ddc84;
        }
        
        .call-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a2744;
            color: #b0c4e8;
        }
        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        
        .btn-call { background: #2b6c9e; color: white; }
        .btn-call.active { background: #dc3545; }
        .btn-mute { background: #2a3a5a; }
        .btn-mute.muted { background: #f5a623; color: #000; }
        .btn-leave { background: #5a2a2a; color: #ff8888; }
        
        .members-section {
            background: #0f1625;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .members-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .members-header h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #667799;
        }
        .members-count {
            background: #1a2744;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        .member-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            transition: background 0.2s;
        }
        .member-item:hover { background: rgba(255,255,255,0.05); }
        .member-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a4a7a, #4a2a7a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        .member-status {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 12px;
            background: #1a2744;
        }
        .member-status.speaking { background: #3ddc84; color: #000; }
        .member-status.muted { background: #f5a623; color: #000; }
        
        .login-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-box {
            background: #141b2b;
            padding: 40px;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .login-box h2 {
            margin-bottom: 8px;
            font-size: 24px;
        }
        .login-box p {
            color: #8899bb;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .login-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #0a0e1a;
            color: #e0e8f0;
            font-size: 16px;
            margin-bottom: 16px;
        }
        .login-input:focus {
            outline: none;
            border-color: #6c8cff;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6c8cff, #3ddc84);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-btn:hover { transform: scale(1.02); }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2744;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 999;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h2>🎤 Group Voice Call</h2>
        <p>Enter your name to join the call</p>
        <input type="text" id="loginName" class="login-input" placeholder="Your name..." maxlength="20">
        <button class="login-btn" onclick="login()">Join Call</button>
        <div style="margin-top:12px;font-size:12px;color:#667799;text-align:center;">
            Everyone in the room can hear each other
        </div>
    </div>
</div>

<div class="app-container" style="display:none;" id="appContainer">
    <div class="header">
        <div class="logo">🎙️ GroupCall</div>
        <div class="user-info">
            <span class="user-badge">
                <span class="status-dot online"></span>
                <span id="currentUserName">You</span>
            </span>
            <button class="btn" style="padding:6px 14px;font-size:12px;background:#2a2a3a;" onclick="logout()">✕</button>
        </div>
    </div>
    
    <div class="main-grid">
        <div class="call-section">
            <div class="call-status">
                <span class="icon" id="callIcon">📞</span>
                <div class="status-text" id="callStatusText">Ready to call</div>
            </div>
            <div class="call-controls">
                <button class="btn btn-call" id="callBtn" onclick="toggleCall()">📞 Start Call</button>
                <button class="btn btn-mute" id="muteBtn" onclick="toggleMute()" disabled>🔊 Mute</button>
                <button class="btn btn-leave" onclick="leaveCall()" disabled>🚪 Leave</button>
            </div>
            <div style="margin-top:16px;padding:12px;background:#0a0e1a;border-radius:12px;font-size:13px;color:#667799;text-align:center;">
                <span id="participantCount">0</span> participants in call
            </div>
        </div>
        
        <div class="members-section">
            <div class="members-header">
                <h3>👥 Members</h3>
                <span class="members-count" id="memberCount">0</span>
            </div>
            <div class="member-list" id="memberList">
                <div style="text-align:center;color:#667799;padding:20px;font-size:13px;">
                    No members yet
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 🔥 SIMPLE GROUP CALL USING PEER-TO-PEER MESH NETWORK
// Each user connects to every other user directly
// Uses a simple "signaling" via BroadcastChannel (local) 
// For real deployment, replace with WebSocket server
// ============================================================

const STATE = {
    currentUser: null,
    isInCall: false,
    isMuted: false,
    peers: new Map(), // peerId -> { connection, stream, name }
    localStream: null,
    audioElements: new Map(),
    // Simulated "room" - in production, use a signaling server
    roomId: 'group-call-room',
    members: [], // { id, name, status }
    peerConnections: new Map(),
};

// ============================================================
// 🎯 LOGIN SYSTEM
// ============================================================

function login() {
    const nameInput = document.getElementById('loginName');
    const name = nameInput.value.trim() || 'Guest_' + Math.floor(Math.random() * 1000);
    
    STATE.currentUser = {
        id: 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        name: name
    };
    
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';
    document.getElementById('currentUserName').textContent = name;
    
    // Initialize the call system
    initCallSystem();
    
    // Add self to members
    addMember(STATE.currentUser.id, STATE.currentUser.name, 'online');
    
    showToast(`👋 Welcome ${name}!`);
}

function logout() {
    leaveCall();
    STATE.currentUser = null;
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('appContainer').style.display = 'none';
}

// ============================================================
// 📡 SIGNALING SYSTEM (Simulated with BroadcastChannel)
// In production: Replace with WebSocket server
// ============================================================

let channel = null;

function initSignaling() {
    if (channel) return;
    try {
        // BroadcastChannel works across tabs on same browser
        // For real deployment, use WebSocket: new WebSocket('wss://your-server.com')
        channel = new BroadcastChannel('group-call-signal');
        channel.onmessage = (event) => {
            handleSignal(event.data);
        };
        console.log('📡 Signaling initialized');
    } catch (e) {
        console.warn('BroadcastChannel not supported, using localStorage fallback');
        // Fallback: use localStorage with polling
        initLocalStorageSignaling();
    }
}

// Fallback signaling via localStorage (works across tabs)
function initLocalStorageSignaling() {
    const KEY = 'group-call-signal';
    let lastProcessed = 0;
    
    setInterval(() => {
        const data = localStorage.getItem(KEY);
        if (data) {
            try {
                const parsed = JSON.parse(data);
                if (parsed.timestamp > lastProcessed) {
                    lastProcessed = parsed.timestamp;
                    handleSignal(parsed.data);
                }
            } catch(e) {}
        }
    }, 500);
    
    // Override sendSignal
    window.sendSignal = (data) => {
        const payload = {
            timestamp: Date.now(),
            data: data
        };
        localStorage.setItem(KEY, JSON.stringify(payload));
    };
}

function sendSignal(data) {
    if (channel) {
        channel.postMessage(data);
    } else {
        // Use localStorage fallback
        const KEY = 'group-call-signal';
        const payload = {
            timestamp: Date.now(),
            data: data
        };
        localStorage.setItem(KEY, JSON.stringify(payload));
    }
}

// ============================================================
//# 🔗 WEBRTC GROUP CALL ENGINE
// ============================================================

const rtcConfig = {
    iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
    ]
};

function initCallSystem() {
    initSignaling();
    
    // Broadcast our presence
    broadcastPresence();
    
    // Listen for new members
    setInterval(() => {
        // Simulate member heartbeat
        broadcastPresence();
    }, 10000);
}

function broadcastPresence() {
    if (!STATE.currentUser) return;
    sendSignal({
        type: 'presence',
        userId: STATE.currentUser.id,
        name: STATE.currentUser.name,
        inCall: STATE.isInCall
    });
}

function handleSignal(data) {
    console.log('📨 Signal:', data.type, data);
    
    switch(data.type) {
        case 'presence':
            handlePresence(data);
            break;
        case 'offer':
            handleOffer(data);
            break;
        case 'answer':
            handleAnswer(data);
            break;
        case 'ice-candidate':
            handleIceCandidate(data);
            break;
        case 'user-left':
            handleUserLeft(data);
            break;
        case 'call-state':
            handleCallState(data);
            break;
    }
}

// ============================================================
//# 👥 MEMBER MANAGEMENT
// ============================================================

function handlePresence(data) {
    if (data.userId === STATE.currentUser.id) return;
    
    const existing = STATE.members.find(m => m.id === data.userId);
    if (!existing) {
        addMember(data.userId, data.name, data.inCall ? 'online' : 'away');
        // If we're in a call and they're in call, connect to them
        if (STATE.isInCall && data.inCall) {
            connectToPeer(data.userId);
        }
    } else {
        // Update status
        const status = data.inCall ? 'online' : 'away';
        updateMemberStatus(data.userId, status);
        // If they joined the call and we're in call, connect
        if (STATE.isInCall && data.inCall && !STATE.peerConnections.has(data.userId)) {
            connectToPeer(data.userId);
        }
    }
}

function addMember(id, name, status = 'online') {
    STATE.members.push({ id, name, status });
    renderMembers();
    
    // Also add to peer map if not exists
    if (!STATE.peers.has(id)) {
        STATE.peers.set(id, { name, stream: null, connected: false });
    }
}

function updateMemberStatus(id, status) {
    const member = STATE.members.find(m => m.id === id);
    if (member) {
        member.status = status;
        renderMembers();
    }
}

function removeMember(id) {
    STATE.members = STATE.members.filter(m => m.id !== id);
    STATE.peers.delete(id);
    STATE.peerConnections.delete(id);
    renderMembers();
    updateParticipantCount();
}

function renderMembers() {
    const list = document.getElementById('memberList');
    const count = document.getElementById('memberCount');
    count.textContent = STATE.members.length;
    
    if (STATE.members.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#667799;padding:20px;font-size:13px;">No members yet</div>';
        return;
    }
    
    list.innerHTML = STATE.members.map(m => `
        <div class="member-item">
            <div class="member-name">
                <div class="member-avatar">${m.name.charAt(0).toUpperCase()}</div>
                <span>${m.name}</span>
                ${m.id === STATE.currentUser?.id ? ' <span style="font-size:10px;color:#667799;">(you)</span>' : ''}
            </div>
            <span class="member-status ${m.status}">${m.status}</span>
        </div>
    `).join('');
}

function updateParticipantCount() {
    const count = STATE.peerConnections.size;
    document.getElementById('participantCount').textContent = count + 1; // +1 for self
}

// ============================================================
//# 📞 CALL CONTROLS
// ============================================================

async function toggleCall() {
    if (!STATE.isInCall) {
        await startCall();
    } else {
        leaveCall();
    }
}

async function startCall() {
    try {
        // Get microphone
        const stream = await navigator.mediaDevices.getUserMedia({ 
            audio: { echoCancellation: true, noiseSuppression: true }
        });
        STATE.localStream = stream;
        
        // Connect to all existing members
        const existingMembers = STATE.members.filter(m => m.id !== STATE.currentUser.id);
        for (const member of existingMembers) {
            await connectToPeer(member.id);
        }
        
        STATE.isInCall = true;
        updateCallUI();
        broadcastCallState(true);
        showToast('📞 Call started!');
        
        // Update UI
        document.getElementById('callBtn').textContent = '⏹️ End Call';
        document.getElementById('callBtn').classList.add('active');
        document.getElementById('muteBtn').disabled = false;
        document.getElementById('callIcon').textContent = '🔊';
        document.getElementById('callStatusText').textContent = '🔴 Live';
        document.getElementById('callStatusText').classList.add('active');
        
    } catch (err) {
        console.error('❌ Failed to start call:', err);
        showToast('❌ Cannot access microphone. Please allow microphone access.');
    }
}

function leaveCall() {
    // Close all peer connections
    for (const [id, pc] of STATE.peerConnections) {
        pc.close();
    }
    STATE.peerConnections.clear();
    
    // Stop local stream
    if (STATE.localStream) {
        STATE.localStream.getTracks().forEach(t => t.stop());
        STATE.localStream = null;
    }
    
    // Remove all remote audio elements
    for (const [id, audio] of STATE.audioElements) {
        audio.remove();
    }
    STATE.audioElements.clear();
    
    STATE.isInCall = false;
    STATE.isMuted = false;
    broadcastCallState(false);
    updateCallUI();
    updateParticipantCount();
    
    document.getElementById('callBtn').textContent = '📞 Start Call';
    document.getElementById('callBtn').classList.remove('active');
    document.getElementById('muteBtn').disabled = true;
    document.getElementById('muteBtn').textContent = '🔊 Mute';
    document.getElementById('muteBtn').classList.remove('muted');
    document.getElementById('callIcon').textContent = '📞';
    document.getElementById('callStatusText').textContent = 'Ready to call';
    document.getElementById('callStatusText').classList.remove('active');
    
    showToast('Call ended');
}

function toggleMute() {
    if (!STATE.localStream) return;
    STATE.isMuted = !STATE.isMuted;
    STATE.localStream.getAudioTracks().forEach(t => {
        t.enabled = !STATE.isMuted;
    });
    
    const btn = document.getElementById('muteBtn');
    btn.textContent = STATE.isMuted ? '🔇 Muted' : '🔊 Mute';
    btn.classList.toggle('muted', STATE.isMuted);
}

function updateCallUI() {
    const callBtn = document.getElementById('callBtn');
    const leaveBtn = document.querySelector('.btn-leave');
    callBtn.textContent = STATE.isInCall ? '⏹️ End Call' : '📞 Start Call';
    callBtn.classList.toggle('active', STATE.isInCall);
    leaveBtn.disabled = !STATE.isInCall;
    document.getElementById('muteBtn').disabled = !STATE.isInCall;
}

function broadcastCallState(inCall) {
    sendSignal({
        type: 'call-state',
        userId: STATE.currentUser.id,
        inCall: inCall
    });
}

function handleCallState(data) {
    if (data.userId === STATE.currentUser.id) return;
    updateMemberStatus(data.userId, data.inCall ? 'online' : 'away');
    
    if (data.inCall && STATE.isInCall) {
        connectToPeer(data.userId);
    } else if (!data.inCall) {
        // Peer left call
        if (STATE.peerConnections.has(data.userId)) {
            STATE.peerConnections.get(data.userId).close();
            STATE.peerConnections.delete(data.userId);
            updateParticipantCount();
            // Remove audio element
            if (STATE.audioElements.has(data.userId)) {
                STATE.audioElements.get(data.userId).remove();
                STATE.audioElements.delete(data.userId);
            }
        }
    }
}

// ============================================================
//# 🔗 PEER-TO-PEER CONNECTION
// ============================================================

async function connectToPeer(peerId) {
    if (peerId === STATE.currentUser.id) return;
    if (STATE.peerConnections.has(peerId)) return;
    if (!STATE.localStream) return;
    
    console.log('🔗 Connecting to peer:', peerId);
    
    const pc = new RTCPeerConnection(rtcConfig);
    STATE.peerConnections.set(peerId, pc);
    
    // Add local stream
    STATE.localStream.getTracks().forEach(track => {
        pc.addTrack(track, STATE.localStream);
    });
    
    // Handle incoming stream
    pc.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
            const stream = event.streams[0];
            const audioEl = document.createElement('audio');
            audioEl.autoplay = true;
            audioEl.srcObject = stream;
            audioEl.style.display = 'none';
            document.body.appendChild(audioEl);
            STATE.audioElements.set(peerId, audioEl);
            
            // Find member name for debugging
            const member = STATE.members.find(m => m.id === peerId);
            console.log(`🔊 Audio from ${member?.name || peerId}`);
        }
    };
    
    // ICE candidates
    pc.onicecandidate = (event) => {
        if (event.candidate) {
            sendSignal({
                type: 'ice-candidate',
                from: STATE.currentUser.id,
                to: peerId,
                candidate: event.candidate
            });
        }
    };
    
    // Connection state
    pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'connected') {
            console.log('✅ Connected to peer:', peerId);
            updateParticipantCount();
        } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
            console.log('❌ Disconnected from peer:', peerId);
            STATE.peerConnections.delete(peerId);
            updateParticipantCount();
        }
    };
    
    // Create offer
    try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        sendSignal({
            type: 'offer',
            from: STATE.currentUser.id,
            to: peerId,
            sdp: pc.localDescription
        });
    } catch (err) {
        console.error('Offer error:', err);
    }
}

// ============================================================
//# 📨 SIGNAL HANDLERS
// ============================================================

async function handleOffer(data) {
    if (data.to !== STATE.currentUser.id) return;
    if (STATE.peerConnections.has(data.from)) return;
    if (!STATE.localStream) {
        // Auto-start call if not started
        await startCall();
        // Then retry
        setTimeout(() => handleOffer(data), 500);
        return;
    }
    
    const pc = new RTCPeerConnection(rtcConfig);
    STATE.peerConnections.set(data.from, pc);
    
    // Add local stream
    STATE.localStream.getTracks().forEach(track => {
        pc.addTrack(track, STATE.localStream);
    });
    
    pc.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
            const stream = event.streams[0];
            const audioEl = document.createElement('audio');
            audioEl.autoplay = true;
            audioEl.srcObject = stream;
            audioEl.style.display = 'none';
            document.body.appendChild(audioEl);
            STATE.audioElements.set(data.from, audioEl);
        }
    };
    
    pc.onicecandidate = (event) => {
        if (event.candidate) {
            sendSignal({
                type: 'ice-candidate',
                from: STATE.currentUser.id,
                to: data.from,
                candidate: event.candidate
            });
        }
    };
    
    try {
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendSignal({
            type: 'answer',
            from: STATE.currentUser.id,
            to: data.from,
            sdp: pc.localDescription
        });
    } catch (err) {
        console.error('Answer error:', err);
    }
}

async function handleAnswer(data) {
    if (data.to !== STATE.currentUser.id) return;
    const pc = STATE.peerConnections.get(data.from);
    if (!pc) return;
    
    try {
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        console.log('✅ Answer set for:', data.from);
    } catch (err) {
        console.error('Set answer error:', err);
    }
}

async function handleIceCandidate(data) {
    if (data.to !== STATE.currentUser.id) return;
    const pc = STATE.peerConnections.get(data.from);
    if (!pc) return;
    
    try {
        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    } catch (err) {
        console.error('ICE candidate error:', err);
    }
}

function handleUserLeft(data) {
    if (data.userId === STATE.currentUser.id) return;
    removeMember(data.userId);
    if (STATE.peerConnections.has(data.userId)) {
        STATE.peerConnections.get(data.userId).close();
        STATE.peerConnections.delete(data.userId);
        updateParticipantCount();
    }
    if (STATE.audioElements.has(data.userId)) {
        STATE.audioElements.get(data.userId).remove();
        STATE.audioElements.delete(data.userId);
    }
}

function showToast(message) {
    let toast = document.querySelector('.toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.className = 'toast';
        document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.display = 'block';
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
        toast.style.display = 'none';
    }, 3000);
}
